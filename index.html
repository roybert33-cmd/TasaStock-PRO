<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TasaStock PRO - v4.0</title>

  <!-- PWA -->
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/1162/1162499.png">

  <style>
    /* Estilos base y fuentes */
    @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap');
    
    :root {
      --bg: #070708;
      --card: #0e0e10;
      --accent: #ffffff;
      --border: #27272a;
      --text-dim: #71717a;
      --success: #10b981;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { 
      margin: 0; 
      background: var(--bg); 
      color: #fafafa; 
      font-family: 'Geist', sans-serif;
      overflow-x: hidden;
    }

    .mono { font-family: 'Geist Mono', monospace; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

    /* Utility Classes (Tailwind-like) */
    .flex { display: flex; }
    .grid { display: grid; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-2 { gap: 0.5rem; }
    .p-4 { padding: 1rem; }
    .rounded-xl { border-radius: 1rem; }
    .border { border: 1px solid var(--border); }
    .w-full { width: 100%; }
    .text-center { text-align: center; }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(7, 7, 8, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      height: 64px;
    }

    /* Botones */
    .btn {
      padding: 0.5rem 1rem;
      border-radius: 99px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 13px;
    }
    .btn-white { background: #fff; color: #000; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: #fff; }
    .btn-outline:hover { background: var(--border); }
    .btn-ghost { color: var(--text-dim); }
    .btn-ghost:hover { color: #fff; }

    /* Inputs */
    .input-main {
      background: #121214;
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      outline: none;
      width: 100%;
    }
    .input-main:focus { border-color: #52525b; }

    /* Badge */
    .badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 99px;
      text-transform: uppercase;
      font-weight: 700;
    }
    .badge-exento { background: rgba(16, 185, 129, 0.1); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.2); }

    /* Cards */
    .product-card {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 1rem;
      border-radius: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 1rem;
    }
    .modal-content {
      background: #111113;
      border: 1px solid var(--border);
      width: 100%;
      max-width: 500px;
      border-radius: 1.5rem;
      padding: 1.5rem;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .grid-pos { grid-template-columns: 1fr; }
      .hide-mobile { display: none; }
    }
    @media (min-width: 769px) {
      .grid-pos { grid-template-columns: 1.2fr 0.8fr; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Scripts base (React) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- CONFIGURACIÓN Y DATOS INICIALES ---
    const DB_NAME = "tasastock_v4_data";
    const DEFAULT_PRODUCTS = [
      { codigo: "0001", nombre: "Arroz Mary 1kg", stock: 50, costo: 1.1, precio: 1.5, iva: 0, protegido: true, categoria: "exento" },
      { codigo: "0002", nombre: "Harina PAN 1kg", stock: 100, costo: 1.2, precio: 1.8, iva: 0, protegido: true, categoria: "exento" },
      { codigo: "0101", nombre: "Refresco 2L", stock: 24, costo: 1.0, precio: 2.0, iva: 16, protegido: false, categoria: "gravado" }
    ];

    function App() {
      // --- ESTADO ---
      const [productos, setProductos] = useState(() => {
        const saved = localStorage.getItem(DB_NAME);
        return saved ? JSON.parse(saved) : DEFAULT_PRODUCTS;
      });
      const [view, setView] = useState('caja'); // caja, inventario, reportes
      const [cart, setCart] = useState([]);
      const [search, setSearch] = useState('');
      const [tasa, setTasa] = useState(65.5);
      const [filter, setFilter] = useState('todos');
      
      // Estado para Calculadora de Cambio
      const [pagoCliente, setPagoRecibido] = useState({ usd: '', bs: '' });
      
      // Estado para Modales
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingProduct, setEditingProduct] = useState(null);

      // --- PERSISTENCIA ---
      useEffect(() => {
        localStorage.setItem(DB_NAME, JSON.stringify(productos));
      }, [productos]);

      // --- CALCULOS ---
      const filteredProducts = useMemo(() => {
        const s = search.toLowerCase();
        return productos.filter(p => {
          const matchSearch = p.nombre.toLowerCase().includes(s) || p.codigo.includes(s);
          if (filter === 'exento') return matchSearch && p.iva === 0;
          if (filter === 'gravado') return matchSearch && p.iva > 0;
          return matchSearch;
        });
      }, [productos, search, filter]);

      const cartTotals = useMemo(() => {
        let subtotal = 0;
        let ivaTotal = 0;
        cart.forEach(item => {
          const p = item.prod;
          const lineTotal = p.precio * item.cantidad;
          if (p.iva > 0) {
            const base = lineTotal / (1 + (p.iva/100));
            ivaTotal += lineTotal - base;
          }
          subtotal += lineTotal;
        });
        return {
          totalUSD: subtotal,
          totalBS: subtotal * tasa,
          ivaUSD: ivaTotal
        };
      }, [cart, tasa]);

      const cambio = useMemo(() => {
        const pagadoUSD = parseFloat(pagoCliente.usd || 0);
        const pagadoBS = parseFloat(pagoCliente.bs || 0);
        const totalPagadoEnUSD = pagadoUSD + (pagadoBS / tasa);
        const diff = totalPagadoEnUSD - cartTotals.totalUSD;
        return {
          usd: diff > 0 ? diff : 0,
          bs: diff > 0 ? diff * tasa : 0
        };
      }, [pagoCliente, cartTotals, tasa]);

      // --- ACCIONES ---
      const addToCart = (prod) => {
        if (prod.stock <= 0) return;
        const exists = cart.find(c => c.codigo === prod.codigo);
        if (exists) {
          if (exists.cantidad >= prod.stock) return;
          setCart(cart.map(c => c.codigo === prod.codigo ? { ...c, cantidad: c.cantidad + 1 } : c));
        } else {
          setCart([...cart, { codigo: prod.codigo, cantidad: 1, prod }]);
        }
      };

      const updateCartQty = (codigo, delta) => {
        setCart(prev => prev.map(item => {
          if (item.codigo === codigo) {
            const newQty = item.cantidad + delta;
            if (newQty > 0 && newQty <= item.prod.stock) return { ...item, cantidad: newQty };
          }
          return item;
        }).filter(item => item.cantidad > 0));
      };

      const finalizarVenta = () => {
        if (cart.length === 0) return;
        // Restar stock
        const newInventory = productos.map(p => {
          const itemInCart = cart.find(c => c.codigo === p.codigo);
          return itemInCart ? { ...p, stock: p.stock - itemInCart.cantidad } : p;
        });
        setProductos(newInventory);
        setCart([]);
        setPagoRecibido({ usd: '', bs: '' });
        alert("¡Venta procesada con éxito!");
      };

      // Respaldos
      const exportarDatos = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(productos));
        const downloadAnchorNode = document.createElement('a');
        downloadAnchorNode.setAttribute("href", dataStr);
        downloadAnchorNode.setAttribute("download", `respaldo_inventario_${new Date().toLocaleDateString()}.json`);
        document.body.appendChild(downloadAnchorNode);
        downloadAnchorNode.click();
        downloadAnchorNode.remove();
      };

      const importarDatos = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const json = JSON.parse(evt.target.result);
            if (Array.isArray(json)) {
              setProductos(json);
              alert("Inventario cargado correctamente");
            }
          } catch (err) { alert("Archivo inválido"); }
        };
        reader.readAsText(file);
      };

      return (
        <div className="flex flex-col min-h-screen">
          <header className="flex items-center p-4">
            <div className="mx-auto w-full max-w-7xl flex justify-between items-center">
              <div className="flex items-center gap-3">
                <div style={{background:'#fff', color:'#000', padding:'6px 10px', borderRadius:'8px', fontWeight:'bold', fontSize:'12px'}}>POS</div>
                <div className="hide-mobile">
                  <div style={{fontSize:'14px', fontWeight:'bold', letterSpacing:'1px'}}>TASASTOCK PRO</div>
                  <div style={{fontSize:'10px', color: 'var(--text-dim)'}}>SISTEMA DE CONTROL 2026</div>
                </div>
              </div>

              <div className="flex bg-[#121214] p-1 rounded-full border">
                <button onClick={() => setView('caja')} className={`btn ${view==='caja' ? 'btn-white' : 'btn-ghost'}`}>Caja</button>
                <button onClick={() => setView('inventario')} className={`btn ${view==='inventario' ? 'btn-white' : 'btn-ghost'}`}>Inventario</button>
              </div>
            </div>
          </header>

          <main className="flex-1 p-4 mx-auto w-full max-w-7xl">
            {view === 'caja' ? (
              <div className="grid grid-pos gap-6">
                {/* LADO IZQUIERDO: PRODUCTOS */}
                <div className="flex flex-col gap-4">
                  <div className="flex flex-col sm:flex-row gap-3">
                    <div className="relative flex-1">
                      <input 
                        className="input-main" 
                        placeholder="Buscar producto o código..." 
                        value={search}
                        onChange={(e) => setSearch(e.target.value)}
                      />
                    </div>
                    <div className="flex gap-2">
                      <button onClick={() => setFilter('todos')} className={`btn ${filter==='todos'?'btn-outline':'btn-ghost'}`}>Todos</button>
                      <button onClick={() => setFilter('exento')} className={`btn ${filter==='exento'?'btn-outline':'btn-ghost'}`}>Cesta Básica</button>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    {filteredProducts.map(p => (
                      <div key={p.codigo} className={`product-card ${p.stock <= 0 ? 'opacity-40' : ''}`} onClick={() => addToCart(p)}>
                        <div className="flex justify-between items-start">
                          <div>
                            <div className="flex items-center gap-2">
                              <span className="mono" style={{fontSize:'11px', color:'var(--text-dim)'}}>{p.codigo}</span>
                              {p.iva === 0 && <span className="badge badge-exento">Exento</span>}
                            </div>
                            <div style={{fontWeight:'600', marginTop:'4px'}}>{p.nombre}</div>
                          </div>
                          <div className="mono text-center">
                            <div style={{fontSize:'10px', color:'var(--text-dim)'}}>Stock</div>
                            <div style={{color: p.stock < 5 ? '#ef4444' : '#fff'}}>{p.stock}</div>
                          </div>
                        </div>
                        <div className="flex justify-between items-end mt-auto">
                          <div>
                            <div className="mono" style={{fontSize:'18px', fontWeight:'bold'}}>${p.precio.toFixed(2)}</div>
                            <div className="mono" style={{fontSize:'11px', color:'var(--text-dim)'}}>Bs {(p.precio * tasa).toFixed(2)}</div>
                          </div>
                          <div className="btn btn-white" style={{padding:'8px'}}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M12 5v14M5 12h14"/></svg></div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* LADO DERECHO: TICKET */}
                <div className="flex flex-col gap-4">
                  <div className="border rounded-xl p-4 bg-[#0e0e10] flex flex-col gap-4">
                    <div className="flex justify-between items-center border-b border-zinc-800 pb-3">
                      <span style={{fontWeight:'bold'}}>Resumen de Compra</span>
                      <button onClick={() => setCart([])} className="btn-ghost" style={{fontSize:'11px', border:'none', background:'none'}}>Vaciar</button>
                    </div>

                    <div className="flex flex-col gap-3 max-h-60 overflow-y-auto">
                      {cart.map(item => (
                        <div key={item.codigo} className="flex justify-between items-center">
                          <div style={{flex:1}}>
                            <div style={{fontSize:'13px'}}>{item.prod.nombre}</div>
                            <div className="mono" style={{fontSize:'11px', color:'var(--text-dim)'}}>${item.prod.precio.toFixed(2)} c/u</div>
                          </div>
                          <div className="flex items-center gap-3">
                            <div className="flex items-center gap-2 bg-zinc-900 rounded-lg p-1">
                              <button onClick={(e) => {e.stopPropagation(); updateCartQty(item.codigo, -1)}} className="btn-ghost" style={{border:'none', background:'none', padding:'0 5px'}}>-</button>
                              <span className="mono" style={{fontSize:'13px', width:'20px', textAlign:'center'}}>{item.cantidad}</span>
                              <button onClick={(e) => {e.stopPropagation(); updateCartQty(item.codigo, 1)}} className="btn-ghost" style={{border:'none', background:'none', padding:'0 5px'}}>+</button>
                            </div>
                            <div className="mono" style={{width:'60px', textAlign:'right'}}>${(item.prod.precio * item.cantidad).toFixed(2)}</div>
                          </div>
                        </div>
                      ))}
                    </div>

                    <div className="border-t border-zinc-800 pt-3 space-y-2">
                      <div className="flex justify-between text-zinc-400" style={{fontSize:'13px'}}>
                        <span>IVA (16%)</span>
                        <span className="mono">${cartTotals.ivaUSD.toFixed(2)}</span>
                      </div>
                      <div className="flex justify-between items-center">
                        <span style={{fontWeight:'bold', fontSize:'18px'}}>Total</span>
                        <div className="text-right">
                          <div className="mono" style={{fontSize:'22px', fontWeight:'bold'}}>${cartTotals.totalUSD.toFixed(2)}</div>
                          <div className="mono" style={{color: 'var(--success)', fontSize:'14px'}}>Bs {cartTotals.totalBS.toFixed(2)}</div>
                        </div>
                      </div>
                    </div>

                    {/* CALCULADORA DE CAMBIO */}
                    <div className="bg-zinc-900/50 p-3 rounded-xl border border-dashed border-zinc-700">
                      <div style={{fontSize:'11px', color:'var(--text-dim)', marginBottom:'8px', fontWeight:'bold'}}>CALCULADORA DE VUELTO</div>
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="mono" style={{fontSize:'10px'}}>Paga con $</label>
                          <input 
                            type="number" 
                            className="input-main" 
                            style={{padding:'5px 8px'}} 
                            value={pagoCliente.usd}
                            onChange={(e) => setPagoRecibido({...pagoCliente, usd: e.target.value})}
                          />
                        </div>
                        <div>
                          <label className="mono" style={{fontSize:'10px'}}>Paga con Bs</label>
                          <input 
                            type="number" 
                            className="input-main" 
                            style={{padding:'5px 8px'}} 
                            value={pagoCliente.bs}
                            onChange={(e) => setPagoRecibido({...pagoCliente, bs: e.target.value})}
                          />
                        </div>
                      </div>
                      {cambio.usd > 0 && (
                        <div className="mt-3 p-2 bg-emerald-500/10 rounded-lg flex justify-between items-center">
                          <span style={{fontSize:'12px', fontWeight:'bold'}}>CAMBIO:</span>
                          <div className="text-right">
                            <div className="mono" style={{fontSize:'14px', color:'#fff'}}>${cambio.usd.toFixed(2)}</div>
                            <div className="mono" style={{fontSize:'11px', color: 'var(--success)'}}>Bs {cambio.bs.toFixed(2)}</div>
                          </div>
                        </div>
                      )}
                    </div>

                    <button 
                      className="btn btn-white w-full" 
                      style={{height:'50px', fontSize:'16px', justifyContent:'center'}}
                      disabled={cart.length === 0}
                      onClick={finalizarVenta}
                    >
                      Cobrar y Actualizar Stock
                    </button>
                  </div>

                  {/* CONFIG TASA */}
                  <div className="p-4 border rounded-xl flex justify-between items-center bg-[#0e0e10]">
                    <div className="flex items-center gap-2">
                      <div style={{background:'var(--border)', padding:'8px', borderRadius:'50%'}}>💵</div>
                      <div>
                        <div style={{fontSize:'12px', color:'var(--text-dim)'}}>Tasa BCV</div>
                        <div className="mono">1$ = {tasa} Bs</div>
                      </div>
                    </div>
                    <input 
                      type="number" 
                      className="input-main" 
                      style={{width:'80px', textAlign:'center', padding:'5px'}} 
                      value={tasa} 
                      onChange={(e) => setTasa(e.target.value)}
                    />
                  </div>
                </div>
              </div>
            ) : (
              // --- VISTA INVENTARIO ---
              <div className="space-y-6">
                <div className="flex justify-between items-center">
                  <h2 style={{fontSize:'24px', fontWeight:'700'}}>Gestión de Inventario</h2>
                  <div className="flex gap-2">
                    <label className="btn btn-outline" style={{cursor:'pointer'}}>
                      Importar JSON
                      <input type="file" accept=".json" style={{display:'none'}} onChange={importarDatos} />
                    </label>
                    <button onClick={exportarDatos} className="btn btn-outline">Exportar</button>
                    <button onClick={() => {setEditingProduct(null); setIsModalOpen(true)}} className="btn btn-white">+ Nuevo Producto</button>
                  </div>
                </div>

                <div className="border rounded-2xl overflow-hidden bg-[#0e0e10]">
                  <table className="w-full mono" style={{fontSize:'13px', borderCollapse:'collapse'}}>
                    <thead>
                      <tr style={{background:'#121214', textAlign:'left', color:'var(--text-dim)'}}>
                        <th className="p-4">CÓDIGO</th>
                        <th className="p-4">NOMBRE</th>
                        <th className="p-4">STOCK</th>
                        <th className="p-4">COSTO</th>
                        <th className="p-4">PRECIO</th>
                        <th className="p-4">IVA</th>
                        <th className="p-4 text-right">ACCIONES</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-zinc-800">
                      {productos.map(p => (
                        <tr key={p.codigo} style={{borderTop:'1px solid var(--border)'}}>
                          <td className="p-4">{p.codigo}</td>
                          <td className="p-4" style={{fontWeight:'bold'}}>{p.nombre}</td>
                          <td className="p-4" style={{color: p.stock < 10 ? '#ef4444' : '#34d399'}}>{p.stock}</td>
                          <td className="p-4 text-zinc-500">${p.costo.toFixed(2)}</td>
                          <td className="p-4">${p.precio.toFixed(2)}</td>
                          <td className="p-4">{p.iva}%</td>
                          <td className="p-4 text-right">
                            <button 
                              className="btn btn-ghost" 
                              onClick={() => {setEditingProduct(p); setIsModalOpen(true)}}
                            >Editar</button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </main>

          {/* MODAL PARA PRODUCTO (NUEVO/EDITAR) */}
          {isModalOpen && (
            <div className="modal-overlay">
              <div className="modal-content animate-in">
                <h3 style={{marginBottom:'1rem'}}>{editingProduct ? 'Editar Producto' : 'Nuevo Producto'}</h3>
                <div className="grid gap-4">
                  <div className="grid grid-cols-2 gap-2">
                    <input className="input-main" placeholder="Código" defaultValue={editingProduct?.codigo} />
                    <select className="input-main" defaultValue={editingProduct?.iva}>
                      <option value="0">IVA 0% (Exento)</option>
                      <option value="16">IVA 16% (Gravado)</option>
                    </select>
                  </div>
                  <input className="input-main" placeholder="Nombre del producto" defaultValue={editingProduct?.nombre} />
                  <div className="grid grid-cols-3 gap-2">
                    <input className="input-main" type="number" placeholder="Stock" defaultValue={editingProduct?.stock} />
                    <input className="input-main" type="number" placeholder="Costo $" defaultValue={editingProduct?.costo} />
                    <input className="input-main" type="number" placeholder="Precio $" defaultValue={editingProduct?.precio} />
                  </div>
                  <div className="flex gap-2 mt-4">
                    <button className="btn btn-outline w-full" onClick={() => setIsModalOpen(false)}>Cancelar</button>
                    <button className="btn btn-white w-full" onClick={() => {
                      // Aquí iría la lógica de guardado
                      setIsModalOpen(false);
                    }}>Guardar Cambios</button>
                  </div>
                </div>
              </div>
            </div>
          )}
          
          <footer className="p-6 text-center text-zinc-600 mono" style={{fontSize:'10px'}}>
            TASASTOCK PRO 4.0 • SISTEMA POS OFFLINE-FIRST • DISEÑADO PARA VENEZUELA 2026
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
