<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TasaStock PRO - Mobile</title>

  <!-- PWA - Capacidad de instalar como App -->
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap');
    
    :root {
      --bg: #070708;
      --card: #0e0e10;
      --border: #27272a;
      --accent: #ffffff;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text-main: #fafafa;
      --text-dim: #71717a;
      /* Altura del header y bottom bar */
      --header-h: 60px;
    }

    * { 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent; 
      touch-action: manipulation; 
    }

    body { 
      margin: 0; 
      background: var(--bg); 
      color: var(--text-main); 
      font-family: 'Geist', sans-serif;
      overscroll-behavior-y: contain;
    }

    .mono { font-family: 'Geist Mono', monospace; }

    /* LAYOUT PRINCIPAL */
    .app-container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      height: var(--header-h);
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(7, 7, 8, 0.85);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid var(--border);
      padding: 0 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    main {
      flex: 1;
      padding: 1rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    /* GRID DEL POS */
    .pos-grid {
      display: grid;
      gap: 1.5rem;
      grid-template-columns: 1fr; /* Móvil: 1 columna */
    }

    @media (min-width: 1024px) {
      .pos-grid {
        grid-template-columns: 1fr 400px; /* Escritorio/Tablet landscape */
      }
    }

    /* TARJETAS DE PRODUCTO */
    .product-grid {
      display: grid;
      gap: 0.75rem;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    }

    .product-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      transition: transform 0.1s, border-color 0.2s;
    }

    .product-card:active { transform: scale(0.97); }

    /* TICKETS Y CARRITO */
    .cart-container {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: calc(var(--header-h) + 1rem);
    }

    .cart-items {
      max-height: 40vh;
      overflow-y: auto;
      padding: 1rem;
    }

    /* INPUTS AMIGABLES CON EL DEDO */
    .input-touch {
      background: #16161a;
      border: 1px solid var(--border);
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      font-size: 16px; /* Evita zoom en iOS */
      width: 100%;
      outline: none;
    }

    .btn-touch {
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 15px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary { background: var(--accent); color: #000; }
    .btn-secondary { background: var(--border); color: #fff; }

    /* INVENTARIO RESPONSIVE (TABLA A CARDS) */
    .inventory-table {
      width: 100%;
      border-collapse: collapse;
      display: table;
    }

    .inventory-card-list { display: none; }

    @media (max-width: 640px) {
      .inventory-table { display: none; }
      .inventory-card-list { 
        display: grid; 
        grid-template-columns: 1fr;
        gap: 1rem;
      }
      .inv-mobile-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 1rem;
      }
    }

    /* MODALES */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      display: flex;
      align-items: flex-end; /* Mobile: sube desde abajo */
      justify-content: center;
    }

    @media (min-width: 640px) {
      .modal-overlay { align-items: center; }
    }

    .modal-content {
      background: #111113;
      width: 100%;
      max-width: 500px;
      border-radius: 1.5rem 1.5rem 0 0;
      padding: 2rem 1.5rem;
      max-height: 90vh;
      overflow-y: auto;
    }

    @media (min-width: 640px) {
      .modal-content { border-radius: 1.5rem; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Scripts -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    function App() {
      // ESTADO INICIAL
      const [productos, setProductos] = useState(() => {
        const saved = localStorage.getItem("pos_mobile_v1");
        return saved ? JSON.parse(saved) : [
          { codigo: "101", nombre: "Harina PAN", stock: 20, costo: 1.2, precio: 1.8, iva: 0 },
          { codigo: "102", nombre: "Arroz 1kg", stock: 15, costo: 1.0, precio: 1.4, iva: 0 },
          { codigo: "103", nombre: "Coca Cola 2L", stock: 10, costo: 1.5, precio: 2.5, iva: 16 }
        ];
      });

      const [view, setView] = useState('caja');
      const [cart, setCart] = useState([]);
      const [search, setSearch] = useState('');
      const [tasa, setTasa] = useState(65.00);
      const [pagoCliente, setPagoCliente] = useState({ usd: '', bs: '' });

      // GUARDAR DATOS
      useEffect(() => {
        localStorage.setItem("pos_mobile_v1", JSON.stringify(productos));
      }, [productos]);

      // FILTRADO
      const filtered = useMemo(() => {
        return productos.filter(p => 
          p.nombre.toLowerCase().includes(search.toLowerCase()) || p.codigo.includes(search)
        );
      }, [productos, search]);

      // TOTALES
      const totals = useMemo(() => {
        const totalUSD = cart.reduce((acc, item) => acc + (item.precio * item.qty), 0);
        return {
          usd: totalUSD,
          bs: totalUSD * tasa
        };
      }, [cart, tasa]);

      // ACCIONES
      const addToCart = (p) => {
        if (p.stock <= 0) return;
        const exists = cart.find(c => c.codigo === p.codigo);
        if (exists) {
          if (exists.qty < p.stock) {
            setCart(cart.map(c => c.codigo === p.codigo ? {...c, qty: c.qty + 1} : c));
          }
        } else {
          setCart([...cart, {...p, qty: 1}]);
        }
      };

      const processSale = () => {
        if (cart.length === 0) return;
        const newProducts = productos.map(p => {
          const inCart = cart.find(c => c.codigo === p.codigo);
          return inCart ? {...p, stock: p.stock - inCart.qty} : p;
        });
        setProductos(newProducts);
        setCart([]);
        setPagoCliente({usd: '', bs: ''});
        alert("Venta procesada");
      };

      return (
        <div className="app-container">
          <header>
            <div className="flex items-center gap-2">
              <div style={{background:'#fff', color:'#000', padding:'4px 8px', borderRadius:'6px', fontWeight:'700', fontSize:'12px'}}>PRO</div>
              <span style={{fontWeight:'700', fontSize:'14px'}}>TasaStock</span>
            </div>
            
            <div className="flex bg-[#16161a] rounded-full border p-1">
              <button onClick={()=>setView('caja')} className={`btn-touch ${view==='caja'?'btn-primary':'btn-secondary'}`} style={{padding:'6px 12px', fontSize:'12px'}}>Caja</button>
              <button onClick={()=>setView('inv')} className={`btn-touch ${view==='inv'?'btn-primary':'btn-secondary'}`} style={{padding:'6px 12px', fontSize:'12px'}}>Stock</button>
            </div>
          </header>

          <main>
            {view === 'caja' ? (
              <div className="pos-grid">
                {/* SECCIÓN PRODUCTOS */}
                <div className="flex flex-col gap-4">
                  <input 
                    className="input-touch" 
                    placeholder="Buscar producto..." 
                    value={search}
                    onChange={e => setSearch(e.target.value)}
                  />

                  <div className="product-grid">
                    {filtered.map(p => (
                      <div key={p.codigo} className="product-card" onClick={() => addToCart(p)}>
                        <div className="flex justify-between items-start">
                          <span className="badge badge-exento" style={{fontSize:'9px'}}>{p.codigo}</span>
                          <span className="mono" style={{fontSize:'12px', color: p.stock < 5 ? 'var(--danger)' : 'var(--success)'}}>
                            {p.stock} pza
                          </span>
                        </div>
                        <div style={{fontWeight:'600', fontSize:'14px', height:'40px', overflow:'hidden'}}>{p.nombre}</div>
                        <div className="mt-auto">
                          <div className="mono" style={{fontWeight:'700', fontSize:'16px'}}>${p.precio.toFixed(2)}</div>
                          <div className="mono" style={{fontSize:'10px', color:'var(--text-dim)'}}>Bs {(p.precio*tasa).toFixed(2)}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* SECCIÓN CARRITO (Sticky en desktop) */}
                <div className="cart-container">
                  <div className="p-4 border-b border-zinc-800 flex justify-between">
                    <span style={{fontWeight:'700'}}>Carrito ({cart.length})</span>
                    <button onClick={()=>setCart([])} className="mono" style={{background:'none', border:'none', color:'var(--danger)', fontSize:'12px'}}>Vaciar</button>
                  </div>

                  <div className="cart-items">
                    {cart.length === 0 ? (
                      <div className="text-center p-8 text-zinc-600">Carrito vacío</div>
                    ) : (
                      cart.map(item => (
                        <div key={item.codigo} className="flex justify-between items-center mb-4">
                          <div style={{flex:1}}>
                            <div style={{fontSize:'13px', fontWeight:'500'}}>{item.nombre}</div>
                            <div className="mono" style={{fontSize:'11px', color:'var(--text-dim)'}}>${item.precio.toFixed(2)} x {item.qty}</div>
                          </div>
                          <div className="mono" style={{fontWeight:'600'}}>${(item.precio*item.qty).toFixed(2)}</div>
                        </div>
                      ))
                    )}
                  </div>

                  <div className="p-4 bg-[#16161a] rounded-b-2xl border-t border-zinc-800">
                    <div className="flex justify-between items-center mb-4">
                      <div>
                        <div style={{fontSize:'12px', color:'var(--text-dim)'}}>Total a pagar</div>
                        <div className="mono" style={{fontSize:'24px', fontWeight:'800'}}>${totals.usd.toFixed(2)}</div>
                        <div className="mono" style={{fontSize:'14px', color:'var(--success)'}}>Bs {totals.bs.toFixed(2)}</div>
                      </div>
                      <div className="text-right">
                        <label className="mono" style={{fontSize:'10px', display:'block'}}>Tasa BCV</label>
                        <input 
                          type="number" 
                          inputMode="decimal"
                          value={tasa} 
                          onChange={e => setTasa(e.target.value)}
                          style={{width:'70px', background:'none', border:`1px solid ${var(--border)}`, color:'#fff', textAlign:'center', borderRadius:'6px'}}
                        />
                      </div>
                    </div>

                    <button 
                      className="btn-touch btn-primary w-full" 
                      style={{height:'56px'}}
                      disabled={cart.length === 0}
                      onClick={processSale}
                    >
                      Finalizar Venta
                    </button>
                  </div>
                </div>
              </div>
            ) : (
              /* VISTA INVENTARIO RESPONSIVE */
              <div className="flex flex-col gap-6">
                <div className="flex justify-between items-center">
                  <h2 style={{margin:0}}>Inventario</h2>
                  <button className="btn-touch btn-primary" style={{padding:'8px 16px'}}>+ Nuevo</button>
                </div>

                {/* Vista para Tablet/PC */}
                <table className="inventory-table">
                  <thead>
                    <tr style={{textAlign:'left', color:'var(--text-dim)', fontSize:'12px'}}>
                      <th className="p-4">COD</th>
                      <th className="p-4">PRODUCTO</th>
                      <th className="p-4">STOCK</th>
                      <th className="p-4">PRECIO</th>
                      <th className="p-4">ACCIONES</th>
                    </tr>
                  </thead>
                  <tbody>
                    {productos.map(p => (
                      <tr key={p.codigo} style={{borderBottom:'1px solid var(--border)'}}>
                        <td className="p-4 mono">{p.codigo}</td>
                        <td className="p-4 font-600">{p.nombre}</td>
                        <td className="p-4 mono">{p.stock}</td>
                        <td className="p-4 mono">${p.precio.toFixed(2)}</td>
                        <td className="p-4"><button className="btn-touch btn-secondary" style={{padding:'5px 10px', fontSize:'11px'}}>Editar</button></td>
                      </tr>
                    ))}
                  </tbody>
                </table>

                {/* Vista para Móvil (Cards) */}
                <div className="inventory-card-list">
                  {productos.map(p => (
                    <div key={p.codigo} className="inv-mobile-card">
                      <div className="flex justify-between items-center mb-2">
                        <span className="badge badge-exento">{p.codigo}</span>
                        <button className="btn-touch btn-secondary" style={{padding:'4px 12px', fontSize:'11px'}}>Editar</button>
                      </div>
                      <div style={{fontWeight:'700', marginBottom:'8px'}}>{p.nombre}</div>
                      <div className="flex justify-between text-zinc-400 mono" style={{fontSize:'13px'}}>
                        <span>Stock: <b style={{color: p.stock < 5 ? 'var(--danger)' : '#fff'}}>{p.stock}</b></span>
                        <span>Precio: <b style={{color:'#fff'}}>${p.precio.toFixed(2)}</b></span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          <footer style={{padding:'2rem', textAlign:'center', color:'var(--text-dim)', fontSize:'10px'}} className="mono">
            TASASTOCK MOBILE PRO 2026 • FUNCIONA OFFLINE
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
