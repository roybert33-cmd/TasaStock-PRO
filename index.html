<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TasaStock PRO 2026</title>

  <!-- React y Babel desde CDN confiable -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&family=Geist+Mono:wght@400;700&display=swap');
    
    :root {
      --bg: #070708;
      --card: #0e0e10;
      --border: #27272a;
      --accent: #ffffff;
      --success: #10b981;
      --danger: #ef4444;
      --text-dim: #71717a;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body { 
      margin: 0; 
      background-color: var(--bg); 
      color: #fafafa; 
      font-family: 'Geist', sans-serif;
      overscroll-behavior-y: contain;
    }

    .mono { font-family: 'Geist Mono', monospace; }

    /* Contenedor Principal */
    .app-container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(7, 7, 8, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    main {
      flex: 1;
      padding: 12px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    /* Grilla responsiva */
    .pos-layout {
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr;
    }

    @media (min-width: 1024px) {
      .pos-layout {
        grid-template-columns: 1fr 380px;
      }
    }

    /* Tarjetas de Producto */
    .product-grid {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    }

    .product-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .product-card:active { transform: scale(0.96); background: #16161a; }

    /* Carrito */
    .cart-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      max-height: 85vh;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    /* Botones y Formas */
    .btn {
      border-radius: 12px;
      padding: 12px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
    }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-secondary { background: var(--border); color: #fff; }
    
    .input-touch {
      background: #121214;
      border: 1px solid var(--border);
      color: #fff;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px; /* Evita zoom en iOS */
      width: 100%;
      outline: none;
      margin-bottom: 12px;
    }

    /* Inventario Mobile */
    .inv-card {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--border);
      color: var(--text-dim);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    function App() {
      // 1. Datos iniciales
      const [productos, setProductos] = useState(() => {
        const saved = localStorage.getItem("pos_v4_store");
        return saved ? JSON.parse(saved) : [
          { codigo: "001", nombre: "Harina PAN", stock: 50, precio: 1.80, costo: 1.20 },
          { codigo: "002", nombre: "Arroz Mary", stock: 30, precio: 1.45, costo: 0.90 },
          { codigo: "003", nombre: "Aceite 1L", stock: 20, precio: 3.50, costo: 2.60 },
          { codigo: "004", nombre: "Azúcar 1kg", stock: 15, precio: 1.20, costo: 0.85 },
        ];
      });

      const [cart, setCart] = useState([]);
      const [view, setView] = useState('caja'); // caja o inventario
      const [search, setSearch] = useState('');
      const [tasa, setTasa] = useState(65.50);

      // Guardar cambios
      useEffect(() => {
        localStorage.setItem("pos_v4_store", JSON.stringify(productos));
      }, [productos]);

      // Filtrado de búsqueda
      const filtered = productos.filter(p => 
        p.nombre.toLowerCase().includes(search.toLowerCase()) || p.codigo.includes(search)
      );

      // Totales
      const totalUSD = cart.reduce((acc, item) => acc + (item.precio * item.qty), 0);

      // Acciones de Carrito
      const addToCart = (p) => {
        if (p.stock <= 0) return;
        const exists = cart.find(c => c.codigo === p.codigo);
        if (exists) {
          if (exists.qty < p.stock) {
            setCart(cart.map(c => c.codigo === p.codigo ? {...c, qty: c.qty + 1} : c));
          }
        } else {
          setCart([...cart, {...p, qty: 1}]);
        }
      };

      const updateQty = (codigo, delta) => {
        setCart(prev => prev.map(item => {
          if (item.codigo === codigo) {
            const newQty = item.qty + delta;
            return newQty > 0 && newQty <= item.stock ? {...item, qty: newQty} : item;
          }
          return item;
        }).filter(item => item.qty > 0));
      };

      const finalizarVenta = () => {
        if (cart.length === 0) return;
        const nuevosProds = productos.map(p => {
          const enCart = cart.find(c => c.codigo === p.codigo);
          return enCart ? { ...p, stock: p.stock - enCart.qty } : p;
        });
        setProductos(nuevosProds);
        setCart([]);
        alert("Venta procesada con éxito");
      };

      return (
        <div className="app-container">
          <header>
            <div style={{display:'flex', alignItems:'center', gap:'10px'}}>
              <div style={{background:'#fff', color:'#000', padding:'4px 8px', borderRadius:'6px', fontWeight:'700', fontSize:'14px'}}>PRO</div>
              <span style={{fontWeight:'700'}}>TasaStock</span>
            </div>
            <div style={{display:'flex', background:'#121214', borderRadius:'30px', padding:'4px', border:'1px solid var(--border)'}}>
              <button onClick={()=>setView('caja')} className="btn" style={{padding:'6px 16px', background: view==='caja'?'#fff':'transparent', color: view==='caja'?'#000':'#71717a'}}>Caja</button>
              <button onClick={()=>setView('inv')} className="btn" style={{padding:'6px 16px', background: view==='inv'?'#fff':'transparent', color: view==='inv'?'#000':'#71717a'}}>Stock</button>
            </div>
          </header>

          <main>
            {view === 'caja' ? (
              <div className="pos-layout">
                {/* LADO PRODUCTOS */}
                <div>
                  <input 
                    className="input-touch" 
                    placeholder="Buscar por nombre o código..." 
                    value={search}
                    onChange={(e)=>setSearch(e.target.value)}
                  />
                  
                  <div className="product-grid">
                    {filtered.map(p => (
                      <div key={p.codigo} className="product-card" onClick={() => addToCart(p)}>
                        <div style={{display:'flex', justifyContent:'between', width:'100%'}}>
                          <span className="badge">{p.codigo}</span>
                          <span style={{marginLeft:'auto', fontSize:'11px', color: p.stock < 5 ? 'var(--danger)':'var(--success)'}}>{p.stock} disp</span>
                        </div>
                        <div style={{fontWeight:'600', fontSize:'14px', height:'34px', overflow:'hidden'}}>{p.nombre}</div>
                        <div style={{marginTop:'auto'}}>
                          <div className="mono" style={{fontSize:'18px', fontWeight:'700'}}>${p.precio.toFixed(2)}</div>
                          <div className="mono" style={{fontSize:'10px', color:'var(--text-dim)'}}>Bs {(p.precio * tasa).toFixed(2)}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* LADO CARRITO */}
                <div className="cart-box">
                  <div style={{padding:'16px', borderBottom:'1px solid var(--border)', display:'flex', justifyContent:'space-between'}}>
                    <span style={{fontWeight:'700'}}>Carrito ({cart.length})</span>
                    <button onClick={()=>setCart([])} style={{background:'none', border:'none', color:'var(--danger)', fontSize:'12px'}}>Vaciar</button>
                  </div>

                  <div className="cart-items">
                    {cart.length === 0 ? (
                      <div style={{textAlign:'center', padding:'40px 0', color:'var(--text-dim)'}}>Carrito vacío</div>
                    ) : (
                      cart.map(item => (
                        <div key={item.codigo} style={{display:'flex', justifyContent:'space-between', marginBottom:'16px', alignItems:'center'}}>
                          <div style={{flex:1}}>
                            <div style={{fontSize:'13px', fontWeight:'600'}}>{item.nombre}</div>
                            <div className="mono" style={{fontSize:'11px', color:'var(--text-dim)'}}>${item.precio.toFixed(2)} x {item.qty}</div>
                          </div>
                          <div style={{display:'flex', alignItems:'center', gap:'12px'}}>
                            <div style={{display:'flex', alignItems:'center', gap:'8px', background:'#1c1c21', borderRadius:'8px', padding:'4px'}}>
                              <button onClick={()=>updateQty(item.codigo, -1)} style={{width:'24px', height:'24px', border:'none', background:'none', color:'#fff'}}>–</button>
                              <span className="mono" style={{fontSize:'12px'}}>{item.qty}</span>
                              <button onClick={()=>updateQty(item.codigo, 1)} style={{width:'24px', height:'24px', border:'none', background:'none', color:'#fff'}}>+</button>
                            </div>
                            <div className="mono" style={{width:'50px', textAlign:'right', fontSize:'14px'}}>${(item.precio * item.qty).toFixed(2)}</div>
                          </div>
                        </div>
                      ))
                    )}
                  </div>

                  <div style={{padding:'16px', background:'#121214', borderRadius:'0 0 18px 18px', borderTop:'1px solid var(--border)'}}>
                    <div style={{display:'flex', justifyContent:'space-between', marginBottom:'12px'}}>
                      <div>
                        <div style={{fontSize:'12px', color:'var(--text-dim)'}}>Total a Pagar</div>
                        <div className="mono" style={{fontSize:'28px', fontWeight:'700'}}>${totalUSD.toFixed(2)}</div>
                        <div className="mono" style={{fontSize:'16px', color:'var(--success)'}}>Bs {(totalUSD * tasa).toFixed(2)}</div>
                      </div>
                      <div style={{textAlign:'right'}}>
                        <span style={{fontSize:'10px', color:'var(--text-dim)', display:'block'}}>TASA BCV</span>
                        <input 
                          type="number" 
                          value={tasa} 
                          onChange={(e)=>setTasa(e.target.value)}
                          style={{width:'70px', background:'transparent', border:'1px solid var(--border)', color:'#fff', textAlign:'center', borderRadius:'6px', padding:'4px', marginTop:'4px'}}
                        />
                      </div>
                    </div>
                    <button onClick={finalizarVenta} className="btn btn-primary" style={{width:'100%', height:'54px', fontSize:'16px'}} disabled={cart.length===0}>
                      Finalizar Venta
                    </button>
                  </div>
                </div>
              </div>
            ) : (
              /* VISTA INVENTARIO */
              <div style={{display:'flex', flexDirection:'column', gap:'12px'}}>
                <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'10px'}}>
                  <h2 style={{margin:0, fontSize:'20px'}}>Inventario</h2>
                  <button className="btn btn-primary" style={{padding:'8px 16px'}}>+ Nuevo</button>
                </div>
                <div style={{borderRadius:'16px', overflow:'hidden', border:'1px solid var(--border)'}}>
                  {productos.map(p => (
                    <div key={p.codigo} className="inv-card">
                      <div>
                        <div style={{fontWeight:'600'}}>{p.nombre}</div>
                        <div className="mono" style={{fontSize:'12px', color:'var(--text-dim)'}}>COD: {p.codigo} • Costo: ${p.costo.toFixed(2)}</div>
                      </div>
                      <div style={{textAlign:'right'}}>
                        <div className="mono" style={{fontSize:'14px'}}>${p.precio.toFixed(2)}</div>
                        <div className="mono" style={{fontSize:'12px', color: p.stock < 10 ? 'var(--danger)':'#fff'}}>Stock: {p.stock}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          <footer style={{padding:'20px', textAlign:'center', fontSize:'10px', color:'var(--text-dim)'}} className="mono">
            TASASTOCK PRO V4 • 2026 • RESPALDO LOCAL ACTIVO
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
