  <!-- PLAYABLE_TOUCH_PATCH_V1 -->
  <script>
    (function() {
      if (window.__playableTouchPatchInstalled) return;
      window.__playableTouchPatchInstalled = true;
      var origAdd = EventTarget.prototype.addEventListener;
      var blockedTypes = { touchstart: 1, touchmove: 1, wheel: 1 };
      EventTarget.prototype.addEventListener = function(type, listener, options) {
        if (blockedTypes[type]) {
          if (options === undefined || options === null) {
            options = { passive: true };
          } else if (typeof options === 'boolean') {
            options = { capture: options, passive: true };
          } else {
            options = Object.assign({}, options, { passive: true });
          }
        }
        return origAdd.call(this, type, listener, options);
      };
    })();
  </script>

<body>
  <div id="root"></div>

  <!-- REACT APP CORE -->
  <script type="module">
    import React, { useState, useEffect, useMemo } from 'https://esm.sh/react@18.2.0';
    import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client';

    const DB_KEY = "pos_cesta_basica_2026_v3";
    const VENTAS_KEY = "pos_ventas_history_v1";

    const INITIAL_PRODS = [
      {codigo:"0001",nombre:"Arroz Mary 1kg",stock:200,costo:1.2,precio:1.6,iva:0,protegido:true,categoria:"exento"},
      {codigo:"0002",nombre:"Harina PAN 1kg",stock:100,costo:1.5,precio:1.9,iva:0,protegido:true,categoria:"exento"},
      {codigo:"0101",nombre:"Refresco Coca-Cola 2L",stock:50,costo:1.2,precio:1.8,iva:16,protegido:false,categoria:"gravado"}
    ];

    function App() {
      // ESTADOS PRINCIPALES
      const [productos, setProductos] = useState(() => {
        const saved = localStorage.getItem(DB_KEY);
        return saved ? JSON.parse(saved) : INITIAL_PRODS;
      });
      
      const [ventas, setVentas] = useState(() => {
        const saved = localStorage.getItem(VENTAS_KEY);
        return saved ? JSON.parse(saved) : [];
      });

      const [nombreTienda, setNombreTienda] = useState(localStorage.getItem("pos_tienda_name") || "MI NEGOCIO");
      const [activeTab, setActiveTab] = useState("caja");
      const [tasa, setTasa] = useState(68.5);
      const [tasaInput, setTasaInput] = useState("68.5");
      
      // ESTADOS DE CAJA
      const [busqueda, setBusqueda] = useState("");
      const [carrito, setCarrito] = useState([]);
      const [pagaCon, setPagaCon] = useState("");
      const [showTicketModal, setShowTicketModal] = useState(false);
      const [lastVenta, setLastVenta] = useState(null);

      // ESTADOS DE INVENTARIO
      const [editModal, setEditModal] = useState(false);
      const [currentProd, setCurrentProd] = useState(null);
      const [filtroInv, setFiltroInv] = useState("todos"); // todos, bajo, agotado, exento
      const [bulkModal, setBulkModal] = useState(false);

      // PERSISTENCIA
      useEffect(() => localStorage.setItem(DB_KEY, JSON.stringify(productos)), [productos]);
      useEffect(() => localStorage.setItem(VENTAS_KEY, JSON.stringify(ventas)), [ventas]);
      useEffect(() => localStorage.setItem("pos_tienda_name", nombreTienda), [nombreTienda]);

      // LÓGICA DE BÚSQUEDA Y FILTROS
      const prodsFiltrados = useMemo(() => {
        let res = productos.filter(p => 
          p.nombre.toLowerCase().includes(busqueda.toLowerCase()) || 
          p.codigo.includes(busqueda)
        );
        if(activeTab === 'inventario') {
          if(filtroInv === 'bajo') res = res.filter(p => p.stock > 0 && p.stock < 10);
          if(filtroInv === 'agotado') res = res.filter(p => p.stock <= 0);
          if(filtroInv === 'exento') res = res.filter(p => p.iva === 0);
        }
        return res.sort((a,b) => (a.protegido === b.protegido) ? 0 : a.protegido ? -1 : 1);
      }, [productos, busqueda, filtroInv, activeTab]);

      // LÓGICA DEL CARRITO
      const cartItems = useMemo(() => {
        return carrito.map(item => ({
          ...item,
          prod: productos.find(p => p.codigo === item.codigo)
        })).filter(i => i.prod);
      }, [carrito, productos]);

      const totales = useMemo(() => {
        let base = 0, iva = 0, exento = 0;
        cartItems.forEach(item => {
          const sub = item.prod.precio * item.cantidad;
          if(item.prod.iva === 0) exento += sub;
          else {
            const b = sub / (1 + (item.prod.iva / 100));
            base += b;
            iva += (sub - b);
          }
        });
        const totalUSD = base + iva + exento;
        return { base, iva, exento, totalUSD, totalBs: totalUSD * tasa };
      }, [cartItems, tasa]);

      const vuelto = pagaCon ? (parseFloat(pagaCon) - totales.totalUSD) : 0;

      // ACCIONES
      const addToCart = (code) => {
        const p = productos.find(x => x.codigo === code);
        if(!p || p.stock <= 0) return;
        const exists = carrito.find(x => x.codigo === code);
        if(exists) {
          if(exists.cantidad >= p.stock) return;
          setCarrito(carrito.map(x => x.codigo === code ? {...x, cantidad: x.cantidad + 1} : x));
        } else {
          setCarrito([...carrito, {codigo: code, cantidad: 1}]);
        }
      };

      const updateQty = (code, delta) => {
        setCarrito(prev => prev.map(item => {
          if(item.codigo !== code) return item;
          const p = productos.find(x => x.codigo === code);
          const newQty = item.cantidad + delta;
          return (newQty > 0 && newQty <= p.stock) ? {...item, cantidad: newQty} : item;
        }));
      };

      const finalizarVenta = () => {
        if(carrito.length === 0) return;
        const nuevaVenta = {
          id: Date.now(),
          fecha: new Date().toLocaleString(),
          items: cartItems.map(i => ({nombre: i.prod.nombre, cant: i.cantidad, precio: i.prod.precio})),
          totalUSD: totales.totalUSD,
          totalBs: totales.totalBs,
          tasa: tasa
        };

        // Descontar Stock
        setProductos(prev => prev.map(p => {
          const inCart = carrito.find(c => c.codigo === p.codigo);
          return inCart ? {...p, stock: p.stock - inCart.cantidad} : p;
        }));

        setVentas([nuevaVenta, ...ventas]);
        setLastVenta(nuevaVenta);
        setCarrito([]);
        setPagaCon("");
        setShowTicketModal(true);
        try { playBeep(); } catch(e){}
      };

      const playBeep = () => {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 880;
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
        osc.start();
        osc.stop(ctx.currentTime + 0.5);
      };

      const shareWhatsApp = (venta) => {
        const texto = `*${nombreTienda}*\n📌 Recibo: #${venta.id}\n📅 ${venta.fecha}\n------------------\n` + 
          venta.items.map(i => `${i.cant}x ${i.nombre} - $${(i.precio*i.cant).toFixed(2)}`).join('\n') + 
          `\n------------------\n*TOTAL: $${venta.totalUSD.toFixed(2)}*\n(Bs ${venta.totalBs.toLocaleString('es-VE')})\nTasa: ${venta.tasa}`;
        window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, '_blank');
      };

      const handleBackup = () => {
        const data = { productos, ventas, nombreTienda, tasa };
        const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `TasaStock_Backup_${new Date().toLocaleDateString()}.json`;
        a.click();
      };

      const handleImport = (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            if(data.productos) setProductos(data.productos);
            if(data.ventas) setVentas(data.ventas);
            if(data.nombreTienda) setNombreTienda(data.nombreTienda);
            alert("Respaldo cargado con éxito");
          } catch(err) { alert("Archivo inválido"); }
        };
        reader.readAsText(file);
      };

      const bulkPriceIncrease = (pct) => {
        if(!confirm(`¿Aumentar precios un ${pct}% a productos gravados?`)) return;
        setProductos(prev => prev.map(p => {
          if(p.iva > 0 && !p.protegido) {
            return {...p, precio: parseFloat((p.precio * (1 + pct/100)).toFixed(2))};
          }
          return p;
        }));
        setBulkModal(false);
      };

      const stats = useMemo(() => {
        const hoy = new Date().toLocaleDateString();
        const vHoy = ventas.filter(v => new Date(v.id).toLocaleDateString() === hoy);
        return {
          ventasHoyUSD: vHoy.reduce((acc, v) => acc + v.totalUSD, 0),
          ventasHoyBs: vHoy.reduce((acc, v) => acc + v.totalBs, 0),
          cantVentas: vHoy.length
        };
      }, [ventas]);

      // RENDERING HELPERS
      const formatNum = (n) => n.toLocaleString('es-VE', {minimumFractionDigits: 2, maximumFractionDigits: 2});

      return React.createElement("div", {className: "min-h-screen pb-20 md:pb-0"}, 
        // HEADER
        React.createElement("header", {className: "sticky top-0 z-30 glass bg-black/60 border-b border-zinc-800 px-4 h-16 flex items-center justify-between"},
          React.createElement("div", {className: "flex items-center gap-3"},
            React.createElement("div", {className: "w-9 h-9 bg-white text-black rounded-xl grid place-items-center font-black text-xs"}, "PRO"),
            React.createElement("div", null, 
              React.createElement("input", {
                value: nombreTienda, 
                onChange: (e) => setNombreTienda(e.target.value.toUpperCase()),
                className: "bg-transparent font-bold text-sm tracking-tight w-32 focus:border-b border-white"
              }),
              React.createElement("div", {className: "text-[10px] text-zinc-500 uppercase tracking-widest"}, "POS SYSTEM 2026")
            )
          ),
          React.createElement("div", {className: "flex bg-zinc-900 p-1 rounded-full border border-zinc-800"},
            ["caja", "inventario", "reportes"].map(t => 
              React.createElement("button", {
                key: t,
                onClick: () => setActiveTab(t),
                className: `px-4 py-1.5 rounded-full text-xs font-semibold capitalize transition-all ${activeTab === t ? 'tab-active' : 'text-zinc-500'}`
              }, t)
            )
          )
        ),

        // MAIN CONTENT
        React.createElement("main", {className: "max-w-7xl mx-auto p-4 animate-slide-up"},
          
          // TAB: CAJA
          activeTab === "caja" && React.createElement("div", {className: "grid lg:grid-cols-12 gap-6"},
            // Lado Izquierdo: Buscador y Lista
            React.createElement("div", {className: "lg:col-span-8 space-y-4"},
              // Tasa de cambio bar
              React.createElement("div", {className: "bg-zinc-900 border border-zinc-800 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-4"},
                React.createElement("div", {className: "flex items-center gap-3"},
                  React.createElement("div", {className: "w-8 h-8 bg-emerald-500/10 text-emerald-500 rounded-full grid place-items-center"}, "$"),
                  React.createElement("span", {className: "text-xs text-zinc-400 font-medium uppercase"}, "Tasa del día (BCV)")
                ),
                React.createElement("div", {className: "flex items-center gap-2 bg-black px-3 py-1.5 rounded-xl border border-zinc-800"},
                  React.createElement("span", {className: "mono text-xs text-zinc-500"}, "1$ = Bs"),
                  React.createElement("input", {
                    type: "text", 
                    value: tasaInput,
                    onChange: (e) => {
                      setTasaInput(e.target.value);
                      const val = parseFloat(e.target.value.replace(',','.'));
                      if(!isNaN(val)) setTasa(val);
                    },
                    className: "bg-transparent mono text-sm font-bold w-16 outline-none text-center"
                  })
                )
              ),
              
              // Buscador
              React.createElement("div", {className: "relative"},
                React.createElement("span", {className: "absolute left-4 top-1/2 -translate-y-1/2 text-zinc-500 text-lg"}, "🔍"),
                React.createElement("input", {
                  placeholder: "Escribe nombre o código...",
                  value: busqueda,
                  onChange: (e) => setBusqueda(e.target.value),
                  className: "w-full bg-zinc-900 border border-zinc-800 rounded-2xl py-4 pl-12 pr-4 text-sm focus:border-zinc-500 transition-all shadow-xl"
                })
              ),

              // Grid de Productos
              React.createElement("div", {className: "grid grid-cols-1 sm:grid-cols-2 gap-3"},
                prodsFiltrados.length > 0 ? prodsFiltrados.map(p => 
                  React.createElement("div", {
                    key: p.codigo,
                    onClick: () => addToCart(p.codigo),
                    className: `p-4 rounded-2xl border transition-all cursor-pointer active:scale-95 group flex flex-col justify-between h-36 ${p.stock <= 0 ? 'bg-zinc-900/50 border-zinc-800 opacity-40 grayscale' : 'bg-zinc-900 border-zinc-800 hover:border-zinc-600 shadow-lg'}`
                  },
                    React.createElement("div", {className: "flex justify-between items-start"},
                      React.createElement("div", {className: "flex-1 min-w-0"},
                        React.createElement("div", {className: "flex items-center gap-2 mb-1"},
                           React.createElement("span", {className: "mono text-[10px] text-zinc-500 bg-black px-1.5 rounded"}, p.codigo),
                           p.iva === 0 && React.createElement("span", {className: "text-[9px] bg-emerald-500/10 text-emerald-400 px-1.5 rounded uppercase font-bold"}, "Exento")
                        ),
                        React.createElement("h3", {className: "font-semibold text-sm truncate group-hover:text-white"}, p.nombre)
                      ),
                      React.createElement("div", {className: `text-[10px] px-2 py-0.5 rounded-full mono font-bold ${p.stock < 10 ? 'bg-red-500/20 text-red-400' : 'bg-zinc-800 text-zinc-400'}`}, p.stock, " un")
                    ),
                    React.createElement("div", {className: "flex items-end justify-between"},
                      React.createElement("div", null,
                        React.createElement("div", {className: "mono text-lg font-bold text-white"}, "$", formatNum(p.precio)),
                        React.createElement("div", {className: "mono text-[10px] text-zinc-500"}, "Bs ", formatNum(p.precio * tasa))
                      ),
                      React.createElement("div", {className: "w-8 h-8 rounded-full bg-white text-black grid place-items-center shadow-lg group-hover:rotate-90 transition-transform"}, "+")
                    )
                  )
                ) : React.createElement("div", {className: "col-span-full py-20 text-center text-zinc-500"}, "No se encontraron productos")
              )
            ),

            // Lado Derecho: Carrito (Ticket)
            React.createElement("div", {className: "lg:col-span-4"},
              React.createElement("div", {className: "bg-zinc-900 border border-zinc-800 rounded-3xl overflow-hidden sticky top-20 shadow-2xl flex flex-col max-h-[calc(100vh-120px)]"},
                React.createElement("div", {className: "p-5 border-b border-zinc-800 flex justify-between items-center"},
                  React.createElement("h2", {className: "font-bold text-sm tracking-widest uppercase"}, "Ticket de Venta"),
                  React.createElement("button", {onClick: () => setCarrito([]), className: "text-[10px] text-red-400 hover:underline"}, "Vaciar")
                ),
                
                // Lista de Carrito
                React.createElement("div", {className: "flex-1 overflow-y-auto p-4 space-y-3"},
                  cartItems.length > 0 ? cartItems.map(item => 
                    React.createElement("div", {key: item.codigo, className: "flex gap-3 bg-black/40 p-3 rounded-xl border border-zinc-800 animate-slide-up"},
                      React.createElement("div", {className: "flex-1"},
                        React.createElement("div", {className: "text-xs font-medium line-clamp-1 mb-1"}, item.prod.nombre),
                        React.createElement("div", {className: "mono text-[10px] text-zinc-500"}, "$", formatNum(item.prod.precio), " x ", item.cantidad)
                      ),
                      React.createElement("div", {className: "flex items-center gap-2"},
                        React.createElement("button", {onClick: () => updateQty(item.codigo, -1), className: "w-6 h-6 rounded-lg bg-zinc-800 grid place-items-center text-xs hover:bg-zinc-700"}, "-"),
                        React.createElement("span", {className: "mono text-sm w-4 text-center"}, item.cantidad),
                        React.createElement("button", {onClick: () => updateQty(item.codigo, 1), className: "w-6 h-6 rounded-lg bg-zinc-800 grid place-items-center text-xs hover:bg-zinc-700"}, "+")
                      )
                    )
                  ) : React.createElement("div", {className: "text-center py-10 opacity-30"}, "🛒 Carrito vacío")
                ),

                // Footer Ticket: Calculadora y Totales
                React.createElement("div", {className: "p-5 bg-black border-t border-zinc-800 space-y-4"},
                  // Calculadora de Vuelto
                  React.createElement("div", {className: "grid grid-cols-2 gap-2"},
                    React.createElement("div", null,
                      React.createElement("label", {className: "text-[9px] text-zinc-500 block mb-1 uppercase tracking-tighter font-bold"}, "Paga con ($)"),
                      React.createElement("input", {
                        type: "number",
                        value: pagaCon,
                        onChange: (e) => setPagaCon(e.target.value),
                        className: "w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 mono text-sm",
                        placeholder: "0.00"
                      })
                    ),
                    React.createElement("div", {className: "text-right"},
                      React.createElement("label", {className: "text-[9px] text-zinc-500 block mb-1 uppercase tracking-tighter font-bold"}, "Vuelto"),
                      React.createElement("div", {className: `mono text-sm font-bold pt-2 ${vuelto >= 0 ? 'text-emerald-400' : 'text-red-400'}`}, 
                        vuelto !== 0 ? `$${formatNum(vuelto)}` : "---"
                      )
                    )
                  ),
                  
                  // Resumen
                  React.createElement("div", {className: "space-y-1.5"},
                    React.createElement("div", {className: "flex justify-between text-xs text-zinc-400"},
                      React.createElement("span", null, "Subtotal gravado"), React.createElement("span", {className: "mono"}, "$", formatNum(totales.base))
                    ),
                    totales.iva > 0 && React.createElement("div", {className: "flex justify-between text-xs text-zinc-400 font-medium"},
                      React.createElement("span", null, "IVA (16%)"), React.createElement("span", {className: "mono"}, "$", formatNum(totales.iva))
                    ),
                    totales.exento > 0 && React.createElement("div", {className: "flex justify-between text-xs text-emerald-500/80 font-medium"},
                      React.createElement("span", null, "Exento (Cesta)"), React.createElement("span", {className: "mono text-emerald-400"}, "$", formatNum(totales.exento))
                    ),
                    React.createElement("div", {className: "flex justify-between items-end pt-2"},
                      React.createElement("span", {className: "text-sm font-bold"}, "TOTAL"),
                      React.createElement("div", {className: "text-right"},
                        React.createElement("div", {className: "mono text-2xl font-black text-white leading-none"}, "$", formatNum(totales.totalUSD)),
                        React.createElement("div", {className: "mono text-xs text-zinc-400 mt-1"}, "Bs ", formatNum(totales.totalBs))
                      )
                    )
                  ),
                  
                  React.createElement("button", {
                    disabled: carrito.length === 0,
                    onClick: finalizarVenta,
                    className: "w-full bg-white text-black py-4 rounded-2xl font-bold tracking-widest text-sm hover:bg-zinc-200 active:scale-95 transition-all disabled:opacity-30 disabled:cursor-not-allowed"
                  }, "COBRAR AHORA")
                )
              )
            )
          ),

          // TAB: INVENTARIO
          activeTab === "inventario" && React.createElement("div", {className: "space-y-6"},
            // Dashboard Inventario
            React.createElement("div", {className: "grid grid-cols-2 md:grid-cols-4 gap-3"},
              React.createElement("div", {className: "bg-zinc-900 p-4 rounded-2xl border border-zinc-800"},
                React.createElement("div", {className: "text-[10px] text-zinc-500 font-bold uppercase"}, "Costo Total"),
                React.createElement("div", {className: "mono text-xl font-bold"}, "$", formatNum(productos.reduce((acc, p) => acc + (p.costo*p.stock), 0)))
              ),
              React.createElement("div", {className: "bg-zinc-900 p-4 rounded-2xl border border-zinc-800"},
                React.createElement("div", {className: "text-[10px] text-zinc-500 font-bold uppercase"}, "Valor Venta"),
                React.createElement("div", {className: "mono text-xl font-bold text-white"}, "$", formatNum(productos.reduce((acc, p) => acc + (p.precio*p.stock), 0)))
              ),
              React.createElement("div", {className: "bg-zinc-900 p-4 rounded-2xl border border-zinc-800"},
                React.createElement("div", {className: "text-[10px] text-zinc-500 font-bold uppercase"}, "Ganancia Potencial"),
                React.createElement("div", {className: "mono text-xl font-bold text-emerald-400"}, "$", formatNum(productos.reduce((acc, p) => acc + ((p.precio-p.costo)*p.stock), 0)))
              ),
              React.createElement("div", {className: "bg-zinc-900 p-4 rounded-2xl border border-zinc-800"},
                React.createElement("div", {className: "text-[10px] text-zinc-500 font-bold uppercase"}, "SKUs Activos"),
                React.createElement("div", {className: "mono text-xl font-bold"}, productos.length)
              )
            ),

            // Controles de Inventario
            React.createElement("div", {className: "flex flex-wrap items-center justify-between gap-4"},
               React.createElement("div", {className: "flex bg-zinc-900 p-1 rounded-xl border border-zinc-800 flex-wrap"},
                [
                  {id: 'todos', label: 'Todos'},
                  {id: 'bajo', label: 'Bajo Stock'},
                  {id: 'agotado', label: 'Agotados'},
                  {id: 'exento', label: 'Exentos'}
                ].map(f => 
                  React.createElement("button", {

  <!-- SISTEMA DE SEGURIDAD ELIX-0603 (Inalterado) -->
  <script>
  (function(){
    const FORMULA = (base) => {
      base = (base || '').toUpperCase().replace(/[^A-Z]/g,'').slice(0,4).padEnd(4,'X');
      let sum = 0; for(let c of base) sum += c.charCodeAt(0);
      let code = (sum * 37 + 9281) % 10000;
      return base + '-' + String(code).padStart(4,'0');
    };
    const VALIDAR = (licencia) => {
      if(!/^[A-Z]{4}-\d{4}$/.test(licencia)) return false;
      let [base, num] = licencia.split('-');
      return FORMULA(base) === licencia;
    };
    const CSS = `
    #elix-activation-overlay{position:fixed;inset:0;z-index:999999;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;font-family:sans-serif;}
    .elix-card{background:#171717;border:1px solid #2a2a2a;border-radius:24px;padding:24px;width:100%;max-width:380px;text-align:center;}
    .elix-input{width:100%;background:#0a0a0a;border:1.5px solid #333;border-radius:12px;padding:14px;color:#fff;font-size:18px;text-transform:uppercase;margin-top:20px;outline:none;}
    .elix-btn{width:100%;border:none;border-radius:14px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:12px;}
    .elix-btn-white{background:#fff;color:#000;}
    .elix-btn-green{background:#22c55e;color:#000;}
    #elix-owner-modal{position:fixed;inset:0;z-index:1000000;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;}
    #elix-owner-modal.open{display:flex;}
    .elix-owner-card{background:#111;border:1px solid #333;border-radius:24px;padding:20px;width:320px;}
    `;
    const style = document.createElement('style'); style.textContent = CSS; document.head.appendChild(style);

    function crearOverlay(){
      if(document.getElementById('elix-activation-overlay')) return;
      const div = document.createElement('div');
      div.id = 'elix-activation-overlay';
      div.innerHTML = `
        <div class="elix-card">
          <div style="font-size:24px;font-weight:800;color:#fff;margin-bottom:10px">TasaStock PRO</div>
          <div style="color:#888;font-size:14px;">Ingresa tu código de licencia para activar el software.</div>
          <input id="elix-lic-input" class="elix-input" placeholder="ABCD-0000" maxlength="9">
          <button id="elix-activar" class="elix-btn elix-btn-white">Activar Licencia</button>
          <button onclick="window.open('https://wa.me/56900000000','_blank')" class="elix-btn elix-btn-green">Contactar Soporte</button>
        </div>
        <div id="elix-logo-trigger" style="margin-top:20px;width:40px;height:40px;opacity:0.1"></div>
      `;
      document.body.appendChild(div);
      document.getElementById('elix-activar').onclick = () => {
        let val = document.getElementById('elix-lic-input').value.toUpperCase().trim();
        if(VALIDAR(val)){ localStorage.setItem('elix_license', val); div.remove(); } else { alert('Licencia inválida.'); }
      };
    }

    function crearOwnerModal(){
      const m = document.createElement('div');
      m.id = 'elix-owner-modal';
      m.innerHTML = `
        <div class="elix-owner-card">
          <div style="color:#fff;font-weight:800;margin-bottom:15px">GENERADOR DE LICENCIAS</div>
          <input id="elix-base" class="elix-input" placeholder="NOMBRE" maxlength="4">
          <div id="elix-res" style="color:#fff;font-size:24px;font-weight:900;margin:15px 0;text-align:center">----</div>
          <button id="elix-gen" class="elix-btn elix-btn-white">Generar</button>
          <button id="elix-close" class="elix-btn" style="background:#222;color:#fff">Cerrar</button>
        </div>
      `;
      document.body.appendChild(m);
      document.getElementById('elix-gen').onclick = () => {
        let b = document.getElementById('elix-base').value || 'ABCD';
        document.getElementById('elix-res').innerText = FORMULA(b);
      };
      document.getElementById('elix-close').onclick = () => m.classList.remove('open');
    }

    let toques = 0; let timer = null;
    document.addEventListener('click', (ev)=>{
      if(ev.target.id === 'elix-logo-trigger'){
        toques++; clearTimeout(timer);
        timer = setTimeout(()=> toques = 0, 3000);
        if(toques >= 5) document.getElementById('elix-owner-modal').classList.add('open');
      }
    });

    const lic = localStorage.getItem('elix_license');
    if(!lic || !VALIDAR(lic)) crearOverlay();
    crearOwnerModal();
  })();
  </script>
