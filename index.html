<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TasaStock PRO - Cesta Básica 2026</title>

  <!-- PWA -->
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap');
    
    :root {
      --bg: #070708;
      --card: #0e0e10;
      --border: #27272a;
      --accent: #ffffff;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text-dim: #71717a;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { 
      margin: 0; 
      background: var(--bg); 
      color: #fafafa; 
      font-family: 'Geist', sans-serif;
      overflow-x: hidden;
    }

    .mono { font-family: 'Geist Mono', monospace; }

    /* UI MEJORADA */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(7, 7, 8, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }

    .nav-pill {
      display: flex;
      background: #111113;
      padding: 4px;
      border-radius: 99px;
      border: 1px solid var(--border);
    }

    .pill-btn {
      padding: 6px 20px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: 0.2s;
    }

    .pill-btn.active { background: #fff; color: #000; }
    .pill-btn.inactive { background: transparent; color: var(--text-dim); }

    .main-content {
      padding: 16px;
      max-width: 1300px;
      margin: 0 auto;
    }

    /* GRID SISTEMA POS */
    .pos-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 1024px) {
      .pos-grid { grid-template-columns: 1fr 400px; align-items: start; }
    }

    /* TARJETAS DE PRODUCTO CAJA */
    .product-list {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(2, 1fr);
    }

    @media (min-width: 768px) {
      .product-list { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
    }

    .p-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      transition: 0.1s;
    }
    .p-card:active { transform: scale(0.97); background: #16161a; }
    
    .badge-prot {
      background: rgba(16, 185, 129, 0.1);
      color: var(--success);
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }

    /* TICKET ESTILO APPLE */
    .ticket-container {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 1024px) {
      .sticky-ticket { position: sticky; top: 80px; }
    }

    /* MODALES */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    @media (min-width: 640px) { .modal-overlay { align-items: center; padding: 20px; } }

    .modal-box {
      background: #111113;
      width: 100%;
      max-width: 450px;
      border-radius: 24px 24px 0 0;
      padding: 24px;
      border: 1px solid var(--border);
    }
    @media (min-width: 640px) { .modal-box { border-radius: 24px; } }

    .input-group { margin-bottom: 16px; }
    .input-label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
    .input-field {
      background: #000;
      border: 1px solid var(--border);
      color: #fff;
      padding: 12px 16px;
      border-radius: 12px;
      width: 100%;
      font-size: 16px;
      outline: none;
    }
    .input-field:focus { border-color: var(--accent); }

    /* ELIX SYSTEM STYLES (REQUIRED) */
    #elix-activation-overlay { position: fixed; inset: 0; z-index: 999999; background: #0a0a0a; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    function App() {
      // 1. ESTADO DE DATOS (Mismo Key que original)
      const [productos, setProductos] = useState(() => {
        const saved = localStorage.getItem("pos_cesta_basica_2026_v3");
        return saved ? JSON.parse(saved) : []; 
      });

      const [tab, setTab] = useState('caja');
      const [carrito, setCarrito] = useState([]);
      const [search, setSearch] = useState('');
      const [tasa, setTasa] = useState(68.5);
      
      // Estado para Nuevo/Editar Producto
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingProd, setEditingProd] = useState(null);
      const [formData, setFormData] = useState({ codigo: '', nombre: '', stock: 0, costo: 0, precio: 0, iva: 0 });

      // Guardado automático
      useEffect(() => {
        localStorage.setItem("pos_cesta_basica_2026_v3", JSON.stringify(productos));
      }, [productos]);

      // Formateo de moneda
      const f = (n) => Number(n).toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

      // Filtrado
      const filtered = useMemo(() => {
        return productos.filter(p => 
          p.nombre.toLowerCase().includes(search.toLowerCase()) || p.codigo.includes(search)
        );
      }, [productos, search]);

      const totalUSD = carrito.reduce((acc, i) => acc + (i.precio * i.qty), 0);

      // ACCIONES
      const handleAddToCart = (p) => {
        if(p.stock <= 0) return;
        const exist = carrito.find(c => c.codigo === p.codigo);
        if(exist) {
          if(exist.qty < p.stock) setCarrito(carrito.map(c => c.codigo === p.codigo ? {...c, qty: c.qty+1} : c));
        } else {
          setCarrito([...carrito, {...p, qty: 1}]);
        }
      };

      const updateQty = (cod, delta) => {
        setCarrito(prev => prev.map(item => {
          if(item.codigo === cod) {
            const newQty = item.qty + delta;
            return (newQty > 0 && newQty <= item.stock) ? {...item, qty: newQty} : item;
          }
          return item;
        }).filter(i => i.qty > 0));
      };

      const openNewProduct = () => {
        setEditingProd(null);
        setFormData({ codigo: '', nombre: '', stock: '', costo: '', precio: '', iva: 0 });
        setIsModalOpen(true);
      };

      const openEditProduct = (p) => {
        setEditingProd(p);
        setFormData({...p});
        setIsModalOpen(true);
      };

      const saveProduct = () => {
        if(!formData.codigo || !formData.nombre) return alert("Código y Nombre requeridos");
        
        if(editingProd) {
          // Editar existente
          setProductos(productos.map(p => p.codigo === editingProd.codigo ? {...formData, stock: Number(formData.stock), precio: Number(formData.precio)} : p));
        } else {
          // Nuevo: Validar que el código no exista
          if(productos.some(p => p.codigo === formData.codigo)) return alert("El código ya existe");
          setProductos([...productos, {...formData, stock: Number(formData.stock), precio: Number(formData.precio), protegido: false}]);
        }
        setIsModalOpen(false);
      };

      const procesarVenta = () => {
        if(carrito.length === 0) return;
        const nuevosProds = productos.map(p => {
          const enCart = carrito.find(c => c.codigo === p.codigo);
          return enCart ? { ...p, stock: p.stock - enCart.qty } : p;
        });
        setProductos(nuevosProds);
        setCarrito([]);
        alert("Cobro exitoso y stock actualizado");
      };

      return (
        <div style={{minHeight:'100vh', display:'flex', flexDirection:'column'}}>
          <header>
            <div id="elix-logo-trigger" style={{display:'flex', alignItems:'center', gap:'12px'}}>
              <div style={{background:'#fff', color:'#000', width:'32px', height:'32px', borderRadius:'10px', display:'grid', placeItems:'center', fontWeight:'800', fontSize:'11px'}}>PRO</div>
              <div>
                <div style={{fontSize:'13px', fontWeight:'700', letterSpacing:'1px'}}>TasaStock</div>
                <div style={{fontSize:'9px', color: 'var(--text-dim)'}}>SISTEMA POS 2026</div>
              </div>
            </div>
            
            <div className="nav-pill">
              <button onClick={()=>setTab('caja')} className={`pill-btn ${tab==='caja'?'active':'inactive'}`}>Caja</button>
              <button onClick={()=>setTab('inv')} className={`pill-btn ${tab==='inv'?'active':'inactive'}`}>Stock</button>
            </div>
          </header>

          <main className="main-content">
            {tab === 'caja' ? (
              <div className="pos-grid">
                <div>
                  <input className="input-field" style={{marginBottom:'16px'}} placeholder="Buscar por nombre o código..." value={search} onChange={e=>setSearch(e.target.value)} />
                  
                  <div className="product-list">
                    {filtered.length === 0 && <div style={{gridColumn:'1/-1', textAlign:'center', padding:'40px', color:'var(--text-dim)'}}>No hay productos registrados</div>}
                    {filtered.map(p => (
                      <div key={p.codigo} className="p-card" onClick={() => handleAddToCart(p)}>
                        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                          <span className="mono" style={{fontSize:'10px', color:'var(--text-dim)'}}>{p.codigo}</span>
                          {p.protegido && <span className="badge-prot">PROT</span>}
                        </div>
                        <div style={{fontSize:'14px', fontWeight:'600', height:'38px', overflow:'hidden'}}>{p.nombre}</div>
                        <div style={{marginTop:'auto'}}>
                          <div className="mono" style={{fontSize:'18px', fontWeight:'700'}}>${f(p.precio)}</div>
                          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginTop:'4px'}}>
                            <span className="mono" style={{fontSize:'10px', color:'var(--text-dim)'}}>Bs {f(p.precio * tasa)}</span>
                            <span className="mono" style={{fontSize:'10px', color: p.stock < 5 ? 'var(--danger)' : 'var(--success)'}}>{p.stock} pz</span>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="sticky-ticket">
                  <div className="ticket-container">
                    <div style={{padding:'16px', borderBottom:'1px solid var(--border)', fontWeight:'700', display:'flex', justifyContent:'space-between'}}>
                      <span>Resumen</span>
                      <span className="mono" style={{color: 'var(--text-dim)'}}>{carrito.length} items</span>
                    </div>
                    <div style={{padding:'16px', maxHeight:'350px', overflowY:'auto'}}>
                      {carrito.length === 0 ? <div style={{textAlign:'center', color: 'var(--text-dim)', padding:'30px'}}>Carrito vacío</div> : 
                        carrito.map(item => (
                          <div key={item.codigo} style={{display:'flex', justifyContent:'space-between', marginBottom:'16px'}}>
                            <div style={{flex:1}}>
                              <div style={{fontSize:'13px', fontWeight:'600'}}>{item.nombre}</div>
                              <div className="mono" style={{fontSize:'11px', color:'var(--text-dim)'}}>${f(item.precio)} x {item.qty}</div>
                            </div>
                            <div style={{display:'flex', alignItems:'center', gap:'8px'}}>
                              <button onClick={(e)=>{e.stopPropagation(); updateQty(item.codigo, -1)}} style={{width:'32px', height:'32px', borderRadius:'50%', border:'1px solid var(--border)', background:'#16161a', color:'#fff'}}>-</button>
                              <button onClick={(e)=>{e.stopPropagation(); updateQty(item.codigo, 1)}} style={{width:'32px', height:'32px', borderRadius:'50%', border:'1px solid var(--border)', background:'#16161a', color:'#fff'}}>+</button>
                            </div>
                          </div>
                        ))
                      }
                    </div>
                    <div style={{padding:'20px', background:'#111113', borderTop:'1px solid var(--border)'}}>
                       <div style={{display:'flex', justifyContent:'space-between', marginBottom:'8px'}}>
                          <span style={{color:'var(--text-dim)', fontSize:'14px'}}>Total USD</span>
                          <span className="mono" style={{fontSize:'24px', fontWeight:'7
